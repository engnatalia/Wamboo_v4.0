plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
	id 'kotlin-kapt'
    id("com.google.dagger.hilt.android")				
}

android {
    namespace 'wamboo.example.videocompressor'
    compileSdk 34

    defaultConfig {
        applicationId "wamboo.example.videocompressor"
        minSdk 30
        targetSdk 34
        versionCode 13
        versionName "3.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }



    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    kotlin {
        jvmToolchain(17)
    }
    buildFeatures {
        viewBinding true
    }

}
android.defaultConfig.ndk.debugSymbolLevel = 'FULL'

dependencies {

    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'com.google.android.gms:play-services-ads:21.5.0'
    implementation 'com.arthenica:ffmpeg-kit-full-gpl:5.1'
    // In-App Updates (Android 14 compatible)
    implementation("com.google.android.play:app-update:2.1.0")
    implementation("com.google.android.play:app-update-ktx:2.1.0") // For Kotlin


    // add new dependency for view pager
    implementation 'androidx.viewpager2:viewpager2:1.1.0-beta01'
    implementation 'androidx.fragment:fragment-ktx:1.6.0-alpha05'
    implementation 'com.google.android.material:material:1.9.0-alpha01'

    //to perform long running background tasks like video compression
    implementation "androidx.work:work-runtime-ktx:2.8.0"
	implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'


    def lifecycle_version = "2.6.1"
    def activity_version = "1.2.0-alpha07"


    kapt "androidx.lifecycle:lifecycle-compiler:$lifecycle_version"
    implementation "androidx.activity:activity-ktx:$activity_version"

    // Lifecycles only (without ViewModel or LiveData)
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"
    // ViewModel
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    // LiveData
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.5.0'

    implementation 'com.google.android.material:material:1.8.0'

    def room_version = "2.5.1"
    implementation "androidx.room:room-ktx:$room_version"
    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    implementation "com.google.dagger:hilt-android:2.44"
    kapt "com.google.dagger:hilt-android-compiler:2.44"

    implementation 'androidx.fragment:fragment-ktx:1.5.6'
    implementation 'com.google.code.gson:gson:2.10.1'														 



}